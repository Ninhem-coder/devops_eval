# Action locale réutilisable : installe Node, restaure le cache npm et installe les dépendances.
# Utilisée par les jobs de la CI au lieu de répéter ces étapes dans chaque job.
#
# Utilisation dans un workflow (après actions/checkout) :
#   - uses: ./.github/actions/setup-node-deps
#     with:
#       node-version: 22

name: Setup Node + dépendances
description: Installe Node.js, restaure le cache npm et fait npm ci

inputs:
  node-version:
    description: Version de Node.js à installer
    required: false
    default: "22"

runs:
  using: composite
  steps:
    # 1. Installe Node + cache natif de setup-node.
    #    La clé du cache est calculée à partir de package-lock.json :
    #    tant qu'il ne change pas, le cache est réutilisé.
    #    Dans les logs : "Cache restored from key: ..." = cache HIT
    - name: Installer Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: package-lock.json

    # 2. Installe exactement les versions du package-lock.json
    - name: Installer les dépendances
      shell: bash
      run: npm ci
